<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laundry System Proposal Designer — Washer-Extractor + Heat-Pump Dryer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Devanagari:wght@400;500;600;700&family=Tiro+Devanagari+Marathi&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0F141C;
  --console:#161E29;
  --console-2:#1F2937;
  --console-3:#2A3646;
  --rule:#33415580;
  --edge:#334155;
  --muted:#8FA0B5;
  --dim:#64748B;
  --paper:#F2F3EF;
  --paper-2:#E6E8E1;
  --paper-ink:#1A1F17;
  --hp:#16A394;
  --hp-soft:#2BC3B1;
  --heat:#E8A33D;
  --gas:#B45C3E;
  --alert:#E05C4B;
  --ui:"IBM Plex Sans","IBM Plex Sans Devanagari",system-ui,sans-serif;
  --dev:"IBM Plex Sans Devanagari","IBM Plex Sans",system-ui,sans-serif;
  --doc:"Tiro Devanagari Marathi","IBM Plex Sans Devanagari",Georgia,serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --console-w:432px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--ink);
  color:#E2E8F0;
  font-family:var(--ui);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}

/* ============ SHELL ============ */
.shell{display:flex;min-height:100vh;align-items:stretch}
.console{
  width:var(--console-w);flex:0 0 var(--console-w);
  background:var(--console);
  border-right:1px solid var(--edge);
  height:100vh;position:sticky;top:0;overflow-y:auto;
  scrollbar-width:thin;scrollbar-color:#3A4A5E var(--console);
}
.console::-webkit-scrollbar{width:9px}
.console::-webkit-scrollbar-thumb{background:#3A4A5E;border-radius:9px;border:2px solid var(--console)}
.stage{flex:1;min-width:0;background:#0B0F15;padding:26px 26px 90px;display:flex;justify-content:center}

/* ============ CONSOLE HEAD ============ */
.brand{padding:20px 22px 16px;border-bottom:1px solid var(--rule)}
.brand h1{
  margin:0;font-size:15px;font-weight:600;letter-spacing:-.01em;line-height:1.3;
}
.brand .sub{
  margin-top:5px;font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--dim);
}
.brand .strip{display:flex;gap:3px;margin-top:12px}
.brand .strip i{height:3px;flex:1;border-radius:2px;background:var(--console-3)}
.brand .strip i:nth-child(1){background:var(--gas)}
.brand .strip i:nth-child(2){background:var(--heat)}
.brand .strip i:nth-child(3){background:var(--hp)}

/* ============ SECTIONS ============ */
.sec{border-bottom:1px solid var(--rule)}
.sec>summary{
  list-style:none;cursor:pointer;padding:13px 22px;
  display:flex;align-items:center;gap:10px;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--muted);user-select:none;
}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary:hover{color:#CBD5E1;background:#1B2432}
.sec>summary .n{
  font-size:9.5px;color:var(--dim);border:1px solid var(--edge);
  border-radius:3px;padding:1px 5px;letter-spacing:.05em;
}
.sec>summary .chev{margin-left:auto;transition:transform .18s ease;opacity:.5}
.sec[open]>summary .chev{transform:rotate(90deg)}
.sec[open]>summary{color:#E2E8F0}
.body{padding:4px 22px 20px}

/* ============ FIELDS ============ */
.field{margin-bottom:13px}
.field>label,.lbl{
  display:block;font-size:11.5px;color:var(--muted);margin-bottom:5px;font-weight:500;
}
.hint{font-size:10.5px;color:var(--dim);margin-top:4px;line-height:1.45}
input[type=text],input[type=number],select,textarea{
  width:100%;background:var(--ink);border:1px solid var(--edge);border-radius:6px;
  padding:8px 10px;color:#F1F5F9;outline:none;transition:border-color .15s,box-shadow .15s;
}
input[type=number]{font-family:var(--mono)}
input:focus,select:focus,textarea:focus{border-color:var(--hp);box-shadow:0 0 0 3px #16A39426}
select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' fill='none' stroke='%238FA0B5' stroke-width='1.6'><path d='M1 1l4 4 4-4'/></svg>");background-repeat:no-repeat;background-position:right 10px center;padding-right:28px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.unit{position:relative}
.unit .u{
  position:absolute;right:10px;top:50%;transform:translateY(-50%);
  font-family:var(--mono);font-size:10px;color:var(--dim);pointer-events:none;
}
.unit input{padding-right:44px}

/* segmented */
.seg{display:flex;background:var(--ink);border:1px solid var(--edge);border-radius:6px;padding:2px;gap:2px}
.seg button{
  flex:1;background:none;border:0;border-radius:4px;padding:6px 4px;cursor:pointer;
  font-size:11.5px;color:var(--muted);transition:background .15s,color .15s;
}
.seg button[aria-pressed=true]{background:var(--console-3);color:#F1F5F9;font-weight:600}
.seg button:hover:not([aria-pressed=true]){color:#CBD5E1}

/* switch */
.sw{display:flex;align-items:center;gap:10px;cursor:pointer;padding:7px 0;user-select:none}
.sw input{position:absolute;opacity:0;pointer-events:none}
.sw .track{
  width:36px;height:20px;border-radius:20px;background:var(--console-3);
  border:1px solid var(--edge);position:relative;transition:background .18s;flex:0 0 auto;
}
.sw .track::after{
  content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;
  background:var(--muted);transition:transform .18s,background .18s;
}
.sw input:checked+.track{background:#16A39440;border-color:var(--hp)}
.sw input:checked+.track::after{transform:translateX(16px);background:var(--hp-soft)}
.sw input:focus-visible+.track{box-shadow:0 0 0 3px #16A39433}
.sw span.t{font-size:12px;color:#CBD5E1}

/* ============ SIGNATURE: ENERGY LEDGER ============ */
.ledger{padding:16px 22px 20px;background:linear-gradient(180deg,#131B25,#161E29);border-bottom:1px solid var(--rule)}
.ledger h2{
  margin:0 0 3px;font-family:var(--mono);font-size:10.5px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--muted);font-weight:500;
}
.ledger .cap{font-size:10.5px;color:var(--dim);margin-bottom:14px}
.bar{margin-bottom:11px}
.bar .top{display:flex;align-items:baseline;gap:8px;margin-bottom:5px}
.bar .nm{font-size:11.5px;color:#CBD5E1;flex:1}
.bar .vl{font-family:var(--mono);font-size:12.5px;font-weight:500}
.bar .tr{height:7px;background:#0F1620;border-radius:4px;overflow:hidden}
.bar .fl{height:100%;border-radius:4px;width:0;transition:width .55s cubic-bezier(.22,1,.36,1)}
.bar.e .fl{background:linear-gradient(90deg,#E8A33D99,var(--heat))}
.bar.e .vl{color:var(--heat)}
.bar.g .fl{background:linear-gradient(90deg,#B45C3E99,var(--gas))}
.bar.g .vl{color:var(--gas)}
.bar.h .fl{background:linear-gradient(90deg,#16A39499,var(--hp-soft))}
.bar.h .vl{color:var(--hp-soft)}
.bar .sv{font-family:var(--mono);font-size:10px;color:var(--dim);margin-top:4px}

.readout{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:15px}
.rd{background:#0F1620;border:1px solid var(--edge);border-radius:7px;padding:10px 11px}
.rd .k{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.rd .v{font-family:var(--mono);font-size:19px;font-weight:600;margin-top:3px;color:#F1F5F9;line-height:1.1}
.rd .v small{font-size:11px;font-weight:400;color:var(--muted);margin-left:2px}
.rd.acc .v{color:var(--hp-soft)}

/* spec summary chips */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:13px}
.chip{
  font-family:var(--mono);font-size:10px;padding:3px 8px;border-radius:20px;
  background:#0F1620;border:1px solid var(--edge);color:var(--muted);
}
.chip b{color:#E2E8F0;font-weight:600}
.chip.ok{border-color:#16A39466;color:var(--hp-soft)}
.chip.warn{border-color:#E8A33D66;color:var(--heat)}

/* ============ ACTIONS ============ */
.actions{padding:16px 22px 26px;display:grid;gap:8px}
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  border:1px solid var(--edge);background:var(--console-2);color:#E2E8F0;
  padding:10px 12px;border-radius:7px;cursor:pointer;font-size:12.5px;font-weight:500;
  transition:background .15s,border-color .15s,transform .06s;
}
.btn:hover{background:var(--console-3);border-color:#475569}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--hp);border-color:var(--hp);color:#04211E;font-weight:600}
.btn.primary:hover{background:var(--hp-soft);border-color:var(--hp-soft)}
.btn.ghost{background:none}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.foot{padding:0 22px 30px;font-size:10.5px;color:var(--dim);line-height:1.5}

/* ============ PAPER ============ */
.paper-wrap{width:100%;max-width:860px}
.paper-bar{
  display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;
}
.paper-bar .t{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);
}
.paper-bar .spacer{flex:1}
.tabs{display:flex;gap:2px;background:var(--console);border:1px solid var(--edge);border-radius:7px;padding:2px}
.tabs button{
  background:none;border:0;border-radius:5px;padding:6px 12px;cursor:pointer;
  font-size:11.5px;color:var(--muted);
}
.tabs button[aria-selected=true]{background:var(--console-3);color:#F1F5F9;font-weight:600}
.paper{
  background:var(--paper);color:var(--paper-ink);
  border-radius:3px;padding:52px 58px 64px;
  box-shadow:0 1px 0 #ffffff26 inset,0 24px 60px #00000066;
  font-family:var(--doc);font-size:14.4px;line-height:1.72;
}
.paper.en{font-family:"IBM Plex Sans",Georgia,serif;font-size:14px}
.paper h1{
  font-family:var(--dev);font-size:21px;line-height:1.35;margin:0 0 4px;font-weight:700;letter-spacing:-.01em;
}
.paper .h1sub{font-family:var(--dev);font-size:14px;color:#4A5346;margin-bottom:2px;font-weight:500}
.paper .docmeta{
  display:flex;gap:16px;flex-wrap:wrap;font-family:var(--mono);font-size:10px;
  letter-spacing:.06em;text-transform:uppercase;color:#6B7466;
  border-top:1px solid #C9CDC1;border-bottom:1px solid #C9CDC1;padding:7px 0;margin:18px 0 26px;
}
.paper h2{
  font-family:var(--dev);font-size:15px;font-weight:700;margin:30px 0 9px;
  padding-bottom:5px;border-bottom:1.5px solid #1A1F17;display:flex;gap:9px;align-items:baseline;
}
.paper h2 .no{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--hp);flex:0 0 auto}
.paper h3{font-family:var(--dev);font-size:13px;font-weight:700;margin:18px 0 6px}
.paper p{margin:0 0 11px;text-align:justify}
.paper ul{margin:0 0 12px;padding-left:19px}
.paper li{margin-bottom:4px}
.paper strong{font-weight:700}
.paper .num{font-family:var(--mono);font-weight:500;font-size:.94em}
.paper table{width:100%;border-collapse:collapse;margin:12px 0 16px;font-family:var(--dev);font-size:12.3px}
.paper th,.paper td{border:1px solid #B8BDB0;padding:6px 9px;text-align:left;vertical-align:top}
.paper th{background:#E2E5DC;font-weight:700;font-size:11.5px}
.paper td.n,.paper th.n{text-align:right;font-family:var(--mono);font-size:11.6px;white-space:nowrap}
.paper tr.total td{background:#E2E5DC;font-weight:700}
.paper .callout{
  background:#E7EBE3;border-left:3px solid var(--hp);padding:12px 15px;margin:14px 0;font-size:13px;
}
.paper .callout .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:#5A6355;display:block;margin-bottom:4px}
.paper .flow{
  font-family:var(--mono);font-size:11.5px;line-height:2.05;background:#E9ECE4;
  border:1px solid #C9CDC1;padding:14px 18px;margin:12px 0 16px;
}
.paper .flow b{font-family:var(--dev);font-size:12.5px}
.paper .sign{margin-top:44px;display:flex;justify-content:flex-end}
.paper .sign div{text-align:center;font-size:12.5px;line-height:1.9}
.paper .sign .line{border-top:1px solid #1A1F17;width:210px;margin-bottom:5px}
.paper .fine{font-size:11.5px;color:#5A6355;line-height:1.6}

/* ============ MOBILE ============ */
.mobile-tabs{display:none}
@media (max-width:1080px){
  .shell{flex-direction:column}
  .console{width:100%;flex:none;height:auto;position:static;border-right:0;border-bottom:1px solid var(--edge)}
  .stage{padding:16px 12px 80px}
  .paper{padding:30px 22px 40px;font-size:14px}
  .mobile-tabs{display:flex;position:sticky;top:0;z-index:20;background:var(--ink);padding:8px 12px;gap:2px;border-bottom:1px solid var(--edge)}
  .mobile-tabs button{flex:1;background:var(--console);border:1px solid var(--edge);border-radius:6px;padding:9px;cursor:pointer;font-size:12.5px;color:var(--muted)}
  .mobile-tabs button[aria-pressed=true]{background:var(--console-3);color:#fff;font-weight:600}
  body.view-doc .console{display:none}
  body.view-cfg .stage{display:none}
}

/* ============ PRINT ============ */
@media print{
  @page{size:A4;margin:16mm 15mm}
  body{background:#fff}
  .console,.paper-bar,.mobile-tabs,.noprint{display:none !important}
  .shell{display:block}
  /* the mobile view-switch rules must never hide the document when printing */
  .stage,body.view-cfg .stage,body.view-doc .stage{padding:0;background:#fff;display:block !important}
  body.view-cfg .console,body.view-doc .console{display:none !important}
  .paper-wrap{max-width:none}
  .paper{box-shadow:none;padding:0;background:#fff;font-size:11.2pt;line-height:1.6}
  .paper h2{page-break-after:avoid;font-size:12.5pt;margin-top:16pt}
  .paper table{page-break-inside:avoid;font-size:9.6pt}
  .paper .flow,.paper .callout{page-break-inside:avoid}
  .pagebreak{page-break-before:always}
}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
:focus-visible{outline:2px solid var(--hp);outline-offset:2px}
</style>
</head>
<body class="view-cfg">
<div class="mobile-tabs">
  <button id="mtCfg" aria-pressed="true">कॉन्फिगरेशन</button>
  <button id="mtDoc" aria-pressed="false">प्रस्ताव</button>
</div>
<div class="shell">
<aside class="console" id="console"></aside>
<main class="stage">
  <div class="paper-wrap">
    <div class="paper-bar noprint">
      <span class="t">Live proposal</span>
      <div class="tabs" role="tablist" id="langTabs">
        <button role="tab" aria-selected="true" data-lang="mr">मराठी</button>
        <button role="tab" aria-selected="false" data-lang="en">English</button>
      </div>
      <span class="spacer"></span>
      <div class="tabs" role="tablist" id="viewTabs">
        <button role="tab" aria-selected="true" data-view="proposal">Proposal</button>
        <button role="tab" aria-selected="false" data-view="boq">BOQ + Costing</button>
        <button role="tab" aria-selected="false" data-view="tech">Tender specs</button>
      </div>
    </div>
    <article class="paper" id="paper"></article>
  </div>
</main>
</div>
<script>
/* ============================================================
   LAUNDRY SYSTEM PROPOSAL DESIGNER
   Industrial Washer-Extractor + Heat-Pump Tumble Dryer
   ============================================================ */

/* ---------- application presets ---------- */
const APPS = {
  hospital:   {mr:"शासकीय रुग्णालय",            en:"Government hospital",        unit:{mr:"बेड",en:"beds"},        size:200, kg:3.5, occ:85, extra:15, cycles:7, days:365, hw:true},
  medcollege: {mr:"वैद्यकीय महाविद्यालय रुग्णालय", en:"Medical college hospital",   unit:{mr:"बेड",en:"beds"},        size:500, kg:4.0, occ:90, extra:20, cycles:7, days:365, hw:true},
  hostel:     {mr:"शासकीय वसतिगृह",              en:"Government hostel",          unit:{mr:"विद्यार्थी",en:"residents"}, size:400, kg:1.2, occ:90, extra:0,  cycles:5, days:280, hw:true},
  ashram:     {mr:"निवासी आश्रमशाळा",            en:"Residential ashram school",  unit:{mr:"विद्यार्थी",en:"students"},  size:300, kg:1.0, occ:95, extra:0,  cycles:5, days:280, hw:true},
  hotel:      {mr:"हॉटेल / रिसॉर्ट",             en:"Hotel / resort",             unit:{mr:"रूम",en:"rooms"},        size:100, kg:5.0, occ:65, extra:10, cycles:6, days:350, hw:true},
  oldage:     {mr:"वृद्धाश्रम / केअर होम",        en:"Old-age / care home",        unit:{mr:"निवासी",en:"residents"}, size:120, kg:2.5, occ:90, extra:5,  cycles:5, days:365, hw:true},
  central:    {mr:"केंद्रीय व्यावसायिक लॉन्ड्री",  en:"Central commercial laundry", unit:{mr:"—",en:"—"},             kg:0,   occ:100,extra:0,  cycles:8, days:312, hw:true, direct:true}
};

/* ---------- state ---------- */
const S = {
  lang:"mr", view:"proposal",
  app:"hospital",
  org:"", place:"", addressee:"", refno:"", date:new Date().toISOString().slice(0,10),
  beds:200, occ:85, kgBed:3.5, extra:15, directKg:800,
  cycles:7, hours:10, days:365,
  autoSize:true, cap:50, qty:2,
  standby:false,
  /* process */
  rmrIn:50, rmrOut:2, waterRate:12, hotFrac:40, tCold:25, tHot:60,
  /* energy */
  secHP:0.85, secEL:1.60, secGAS:1.45, gasParasitic:0.10, washKWh:0.10,
  copHP:3.5, copGeyser:1.0, effGas:0.85,
  tariff:9.0, lpgRate:95, gasType:"lpg", pngRate:58,
  gridCO2:0.71, lpgCO2:3.0,
  /* commercial */
  convFactor:55, hwSystem:true, softener:true, gst:true, gstRate:18,
  amcPct:5, amcYears:5, contingency:5,
  /* rate card (₹ lakh) */
  rc:{
    washerA:0.20, washerB:2.0,  washerC:0.30, washerD:3.0,
    dryerA:0.30,  dryerB:1.0,   dryerC:0.45,  dryerD:2.5,
    dosingL:0.75, dosingH:1.50,
    panelA:0.025, panelB:0.25,  panelC:0.05,  panelD:0.0,
    instA:0.025,  instB:0.25,   instC:0.025,  instD:1.25,
    testL:0.50,   testA:0.0125, testB:0.375,
    spareA:0.0125,spareB:0.125, spareC:0.025, spareD:0.25,
    hpwhL:1.60,   hpwhH:2.40,
    tankL:0.55,   tankH:0.85,
    softL:0.40,   softH:0.90,
    miscL:0.30,   miscH:0.60
  }
};

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const round=(v,d=0)=>{const m=Math.pow(10,d);return Math.round(v*m)/m;};
const L = (mr,en) => S.lang==="mr" ? mr : en;

function fmt(v,d=0){
  if(!isFinite(v)) return "—";
  return round(v,d).toLocaleString("en-IN",{minimumFractionDigits:d,maximumFractionDigits:d});
}
function lakh(v,d=2){ return "₹"+fmt(v,d)+" "+L("लाख","lakh"); }
function rng(a,b,d=2){ return "₹"+fmt(a,d)+"–"+fmt(b,d)+" "+L("लाख","lakh"); }
function rupee(v){
  if(v>=10000000) return "₹"+fmt(v/10000000,2)+" "+L("कोटी","cr");
  if(v>=100000)   return "₹"+fmt(v/100000,2)+" "+L("लाख","lakh");
  return "₹"+fmt(v,0);
}

/* ============================================================
   ENGINE — sizing, energy, costing
   ============================================================ */
const CAPS=[15,20,25,30,40,50,60,80,100];

function selectMachines(reqPerSlot){
  let best=null;
  CAPS.forEach(cap=>{
    const n=Math.max(1,Math.ceil(reqPerSlot/cap));
    if(n>10) return;
    const util=reqPerSlot/(n*cap);
    let score = 100 - Math.abs(0.85-util)*120;      // target ~85% utilisation
    if(cap===30||cap===50) score += 14;             // standard institutional sizes
    score -= (n-1)*7;                               // prefer fewer machines
    if(n>6) score -= (n-6)*18;                      // a very large bank needs a re-think
    if(util>1.001) score -= 200;
    if(!best||score>best.score) best={cap,n,util,score};
  });
  // load beyond ten of the largest machines: fall back to the largest and flag via utilisation
  if(!best){ const cap=CAPS[CAPS.length-1], n=Math.ceil(reqPerSlot/cap); best={cap,n,util:reqPerSlot/(n*cap),score:0}; }
  return best;
}

function compute(){
  const A=APPS[S.app];
  /* ---- linen load ---- */
  const occupied = A.direct ? 0 : S.beds*S.occ/100;
  const baseLinen = A.direct ? S.directKg : occupied*S.kgBed;
  const daily = A.direct ? S.directKg : baseLinen*(1+S.extra/100);
  const annualLinen = daily*S.days;

  /* ---- machines ---- */
  const reqPerSlot = daily/Math.max(1,S.cycles);
  let cap,qty,auto=null;
  if(S.autoSize){ auto=selectMachines(reqPerSlot); cap=auto.cap; qty=auto.n; }
  else { cap=S.cap; qty=S.qty; }
  const installedQty = qty + (S.standby?1:0);
  const capacityDay = cap*qty*S.cycles;
  const util = capacityDay>0 ? daily/capacityDay : 0;
  const cycleTime = S.cycles>0 ? (S.hours*60)/S.cycles : 0;
  const actualCycles = daily>0 ? daily/(cap*qty) : 0;

  /* ---- water removed in dryer ---- */
  const wPerKg = Math.max(0,(S.rmrIn-S.rmrOut)/100);
  const waterDay = daily*wPerKg;
  const waterYr  = waterDay*S.days;

  /* ---- dryer energy (per day) ---- */
  const dHP   = waterDay*S.secHP;
  const dEL   = waterDay*S.secEL;
  const dGASth= waterDay*S.secGAS;
  const dGASel= waterDay*S.gasParasitic;

  /* ---- hot water ---- */
  const hwLitres = daily*S.waterRate*(S.hotFrac/100);
  const hwTherm  = hwLitres*4.186*Math.max(0,S.tHot-S.tCold)/3600;
  const hwOn     = S.hwSystem ? 1 : 0;   // out of scope for every scenario when not included
  const hwHP     = hwOn*hwTherm/Math.max(.1,S.copHP);
  const hwGeyser = hwOn*hwTherm/Math.max(.1,S.copGeyser);
  const hwGasTh  = hwOn*hwTherm/Math.max(.1,S.effGas);

  /* ---- washer electricity (common) ---- */
  const washKWh = daily*S.washKWh;

  /* ---- fuel conversion ---- */
  const gasKWhPerUnit = S.gasType==="lpg" ? 12.8 : 10.9;    // kWh per kg LPG / per SCM PNG
  const gasRate = S.gasType==="lpg" ? S.lpgRate : S.pngRate;
  const gasCO2PerUnit = S.gasType==="lpg" ? S.lpgCO2 : 2.0;
  const gasCost = th => (th/gasKWhPerUnit)*gasRate;
  const gasUnits= th => th/gasKWhPerUnit;

  /* ---- daily cost by scenario ---- */
  const T=S.tariff;
  const sc = {
    hp:   { kwh: dHP + hwHP + washKWh, fuel:0,
            cost:(dHP+hwHP+washKWh)*T,
            co2:(dHP+hwHP+washKWh)*S.gridCO2 },
    el:   { kwh: dEL + hwGeyser + washKWh, fuel:0,
            cost:(dEL+hwGeyser+washKWh)*T,
            co2:(dEL+hwGeyser+washKWh)*S.gridCO2 },
    gas:  { kwh: dGASel + washKWh, fuel: gasUnits(dGASth+hwGasTh),
            cost:(dGASel+washKWh)*T + gasCost(dGASth+hwGasTh),
            co2:(dGASel+washKWh)*S.gridCO2 + gasUnits(dGASth+hwGasTh)*gasCO2PerUnit }
  };
  ["hp","el","gas"].forEach(k=>{
    sc[k].yr      = sc[k].cost*S.days;
    sc[k].kwhYr   = sc[k].kwh*S.days;
    sc[k].co2Yr   = sc[k].co2*S.days/1000;              // tonnes
    sc[k].perKg   = daily>0 ? sc[k].cost/daily : 0;
  });
  const saveEl  = sc.el.yr - sc.hp.yr;
  const saveGas = sc.gas.yr- sc.hp.yr;

  /* ---- capex ---- */
  const rc=S.rc, n=installedQty;
  const item=(l,h)=>({l,h});
  const washer = item(rc.washerA*cap+rc.washerB, rc.washerC*cap+rc.washerD);
  const dryerHP= item(rc.dryerA*cap+rc.dryerB,  rc.dryerC*cap+rc.dryerD);
  const dosing = item(rc.dosingL, rc.dosingH);
  const panel  = item(rc.panelA*cap+rc.panelB,  rc.panelC*cap+rc.panelD);
  const inst   = item(rc.instA*cap+rc.instB,    rc.instC*cap+rc.instD);
  const test   = item(rc.testL,                 rc.testA*cap+rc.testB);
  const spare  = item(rc.spareA*cap+rc.spareB,  rc.spareC*cap+rc.spareD);
  const testMult = 1+0.35*(n-1);

  const lines=[];
  const push=(key,mr,en,spec,qtyTxt,l,h)=>lines.push({key,mr,en,spec,qtyTxt,l,h});
  push("washer", "Industrial Washer-Extractor","Industrial Washer-Extractor", cap+" kg/cycle", n+" "+L("नग","Nos"), washer.l*n, washer.h*n);
  push("dryer",  "Heat-Pump Tumble Dryer","Heat-Pump Tumble Dryer",         cap+" kg/cycle", n+" "+L("नग","Nos"), dryerHP.l*n, dryerHP.h*n);
  push("dosing", "Automatic Chemical Dosing System","Automatic Chemical Dosing System", L("किमान ६ channels","Min. 6 channels"), n+" "+L("नग","Nos"), dosing.l*n, dosing.h*n);
  if(S.hwSystem){
    const lpd = Math.max(200,Math.ceil(hwLitres/50)*50);
    const tank= Math.max(500,Math.ceil(hwLitres/Math.max(4,S.hours)*3/100)*100);  // ~3 h peak draw buffer
    push("hpwh", "Heat-Pump Water Heating System","Heat-Pump Water Heating System", fmt(lpd)+" LPD @ "+S.tHot+"°C", "1 "+L("संच","Set"), rc.hpwhL*lpd/1000, rc.hpwhH*lpd/1000);
    push("tank", "Insulated Hot-Water Storage Tank","Insulated Hot-Water Storage Tank", fmt(tank)+" L, SS insulated", "1 "+L("नग","No"), rc.tankL*tank/1000, rc.tankH*tank/1000);
  }
  if(S.softener) push("soft","Water Softener / Filtration","Water Softener / Filtration", L("क्षमतेनुसार","As per capacity"), "1 "+L("संच","Set"), rc.softL, rc.softH);
  push("panel", "Electrical & Control Panel","Electrical & Control Panel", "Complete with protection", n+" "+L("संच","Sets"), panel.l*n, panel.h*n);
  push("inst",  "Installation, Plumbing, Drainage & Commissioning","Installation, Plumbing, Drainage & Commissioning","Complete","1 Lot", inst.l*n*0.9, inst.h*n*0.9);
  push("misc",  "Linen Trolleys, Sorting Tables & Accessories","Linen Trolleys, Sorting Tables & Accessories", L("आवश्यकतेनुसार","As required"),"1 Lot", rc.miscL*n, rc.miscH*n);
  push("test",  "Testing, Training & Documentation","Testing, Training & Documentation","Complete","1 Lot", test.l*testMult, test.h*testMult);
  push("spare", "Initial Critical Spares","Initial Critical Spares", L("२ वर्षांसाठी","For 2 years"),"1 Lot", spare.l*n, spare.h*n);

  let subL=lines.reduce((a,x)=>a+x.l,0), subH=lines.reduce((a,x)=>a+x.h,0);
  const contL=subL*S.contingency/100, contH=subH*S.contingency/100;
  let totL=subL+contL, totH=subH+contH;
  const gstL=S.gst?totL*S.gstRate/100:0, gstH=S.gst?totH*S.gstRate/100:0;
  const grandL=totL+gstL, grandH=totH+gstH;

  const equipL=lines.filter(x=>x.key!=="inst"&&x.key!=="test"&&x.key!=="spare").reduce((a,x)=>a+x.l,0);
  const equipH=lines.filter(x=>x.key!=="inst"&&x.key!=="test"&&x.key!=="spare").reduce((a,x)=>a+x.h,0);
  const amcL=equipL*S.amcPct/100, amcH=equipH*S.amcPct/100;

  /* ---- payback (dryer premium only, conservative) ---- */
  const convDryer = {l:dryerHP.l*S.convFactor/100, h:dryerHP.h*S.convFactor/100};
  let premL=(dryerHP.l-convDryer.l)*n, premH=(dryerHP.h-convDryer.h)*n;
  const hwLine=lines.find(x=>x.key==="hpwh");          // geyser bank taken at 30% of HPWH cost
  const premHwL=hwLine?hwLine.l*0.70:0, premHwH=hwLine?hwLine.h*0.70:0;
  premL+=premHwL; premH+=premHwH;
  const premMid=(premL+premH)/2*100000;
  const pbEl  = saveEl>0  ? premMid/saveEl  : Infinity;
  const pbGas = saveGas>0 ? premMid/saveGas : Infinity;

  /* ---- 10-year lifecycle ---- */
  const life=10;
  const capMid=(totL+totH)/2*100000;
  const capConvMid=capMid-premMid;
  const lc={
    hp:  capMid       + sc.hp.yr*life,
    el:  capConvMid   + sc.el.yr*life,
    gas: capConvMid*1.03 + sc.gas.yr*life
  };

  /* ---- connected load estimate ---- */
  const kwWasher=cap*0.16, kwDryer=cap*0.22, kwHW=S.hwSystem?Math.max(2,hwTherm/Math.max(.1,S.copHP)/8):0;
  const connLoad=(kwWasher+kwDryer)*n + kwHW + 3;

  return {A,daily,annualLinen,occupied,cap,qty,installedQty,capacityDay,util,cycleTime,actualCycles,auto,
    wPerKg,waterDay,waterYr,dHP,dEL,dGASth,dGASel,hwLitres,hwTherm,hwHP,hwGeyser,hwGasTh,washKWh,
    sc,saveEl,saveGas,lines,subL,subH,contL,contH,totL,totH,gstL,gstH,grandL,grandH,
    amcL,amcH,premL,premH,premHwL,premHwH,pbEl,pbGas,lc,connLoad,gasUnitName:S.gasType==="lpg"?"kg LPG":"SCM PNG",
    dryerHP,convDryer,life};
}

const TXTFIELDS=["org","place","addressee","refno","date"];
const SWFIELDS=["autoSize","standby","hwSystem","softener","gst"];

function syncInputs(){
  NUMFIELDS.forEach(k=>{ const el=$(k); if(el) el.value=S[k]; });
  TXTFIELDS.forEach(k=>{ const el=$(k); if(el) el.value=S[k]; });
  SWFIELDS.forEach(k=>{ const el=$(k); if(el) el.checked=S[k]; });
  if($("app")) $("app").value=S.app;
  if($("cap")) $("cap").value=S.cap;
  document.querySelectorAll("#gasSeg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.gas===S.gasType));
  const mc=$("manualCap"); if(mc){ mc.style.opacity=S.autoSize?.45:1; mc.style.pointerEvents=S.autoSize?"none":"auto"; }
}

function wireConsole(){
  NUMFIELDS.forEach(k=>{ const el=$(k); if(!el) return;
    el.addEventListener("input",()=>{ const v=parseFloat(el.value); S[k]=isNaN(v)?0:v; render(); });
  });
  TXTFIELDS.forEach(k=>{ const el=$(k); if(!el) return;
    el.addEventListener("input",()=>{ S[k]=el.value; render(); });
  });
  SWFIELDS.forEach(k=>{ const el=$(k); if(!el) return;
    el.addEventListener("change",()=>{ S[k]=el.checked; if(k==="autoSize") syncInputs(); render(); });
  });
  if($("app")) $("app").addEventListener("change",e=>{
    S.app=e.target.value; const A=APPS[S.app];
    if(!A.direct){ S.kgBed=A.kg; S.occ=A.occ; S.extra=A.extra; if(A.size) S.beds=A.size; }
    S.cycles=A.cycles; S.days=A.days; S.hwSystem=A.hw;
    buildConsole(); render();
  });
  if($("cap")) $("cap").addEventListener("change",e=>{ S.cap=+e.target.value; render(); });
  document.querySelectorAll("#gasSeg button").forEach(b=>b.addEventListener("click",()=>{
    S.gasType=b.dataset.gas; syncInputs(); render();
  }));
  $("btnPrint").addEventListener("click",()=>window.print());
  $("btnWord").addEventListener("click",exportWord);
  $("btnCsv").addEventListener("click",exportCsv);
  $("btnSave").addEventListener("click",saveProject);
  $("btnLoad").addEventListener("click",()=>$("fileIn").click());
  $("fileIn").addEventListener("change",loadProject);
  $("btnReset").addEventListener("click",()=>{ if(confirm(L("सर्व मूल्ये मूळ स्थितीत आणायची?","Reset all values to defaults?"))) location.reload(); });
}

/* ---------- ledger ---------- */
function updateLedger(c){
  const max=Math.max(c.sc.el.yr,c.sc.gas.yr,c.sc.hp.yr,1);
  const set=(bid,fid,v)=>{ $(bid).textContent=rupee(v)+"/"+L("वर्ष","yr"); $(fid).style.width=(v/max*100)+"%"; };
  set("bE","fE",c.sc.el.yr); set("bG","fG",c.sc.gas.yr); set("bH","fH",c.sc.hp.yr);
  $("sH").textContent=L("बचत","Saves")+" "+rupee(c.saveEl)+" vs "+L("इलेक्ट्रिक","electric")+" · "+rupee(c.saveGas)+" vs "+L("गॅस","gas");
  $("ledCap").textContent=L(
    "वार्षिक ऊर्जा खर्च — धुलाई, ड्रायिंग व गरम पाणी एकत्रित, "+fmt(S.days)+" दिवस",
    "Annual energy cost — washing, drying and hot water combined, over "+fmt(S.days)+" days");
  $("rDaily").innerHTML=fmt(c.daily)+"<small>kg/"+L("दिन","day")+"</small>";
  $("rSet").innerHTML=c.installedQty+" × "+c.cap+"<small>kg</small>";
  $("rSave").innerHTML=rupee(c.saveEl).replace("₹","₹ ");
  $("rPB").innerHTML=isFinite(c.pbEl)?fmt(c.pbEl,1)+"<small>"+L("वर्षे","yr")+"</small>":"—";
  if($("wPerKg")) $("wPerKg").textContent=fmt(c.wPerKg,2);

  const ch=[];
  ch.push(`<span class="chip">${L("क्षमता","Capacity")} <b>${fmt(c.capacityDay)} kg/${L("दिन","day")}</b></span>`);
  ch.push(`<span class="chip ${c.util>0.95?"warn":"ok"}">${L("वापर","Utilisation")} <b>${fmt(c.util*100)}%</b></span>`);
  ch.push(`<span class="chip">${L("सायकल वेळ","Cycle time")} <b>${fmt(c.cycleTime)} min</b></span>`);
  ch.push(`<span class="chip">${L("जोडलेला भार","Connected load")} <b>~${fmt(c.connLoad)} kW</b></span>`);
  ch.push(`<span class="chip">${L("प्रकल्प","Project")} <b>${fmt(c.grandL,0)}–${fmt(c.grandH,0)} ${L("लाख","L")}</b></span>`);
  ch.push(`<span class="chip ok">CO₂ −<b>${fmt(c.sc.el.co2Yr-c.sc.hp.co2Yr,1)} t/${L("वर्ष","yr")}</b></span>`);
  if(c.util>1) ch.push(`<span class="chip warn">${L("क्षमता अपुरी — सायकल किंवा मशीन वाढवा","Under capacity — add cycles or machines")}</span>`);
  else if(c.util>0.95 && !S.standby) ch.push(`<span class="chip warn">${L("क्षमता पूर्ण वापरात — standby मशीन विचारात घ्या","Running at full capacity — consider a standby machine")}</span>`);
  if(c.installedQty===1 && c.daily>200) ch.push(`<span class="chip warn">${L("एकच मशीन — standby विचारात घ्या","Single machine — consider a standby")}</span>`);
  $("chips").innerHTML=ch.join("");
}

  const paper=$("paper");
  paper.className="paper"+(S.lang==="en"?" en":"");
  paper.innerHTML = S.view==="boq" ? viewBOQ(c) : S.view==="tech" ? viewTech(c) : viewProposal(c);
}

function exportCsv(){
  const c=compute();
  const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
  const rows=[
    ["Laundry system BOQ — indicative budgetary estimate"],
    ["Institution",S.org||"—"],["Location",S.place||"—"],["Application",APPS[S.app].en],
    ["Reference",S.refno||"—"],["Date",S.date],
    ["Daily linen load (kg/day)",round(c.daily,1)],
    ["Configuration",c.installedQty+" x "+c.cap+" kg washer-extractor + heat-pump dryer"],
    [],
    ["Sr.","Item","Specification","Qty","Low (Rs lakh)","High (Rs lakh)","Mid (Rs lakh)"]
  ];
  c.lines.forEach((x,i)=>rows.push([i+1,x.en||x.mr,x.spec,x.qtyTxt,round(x.l,2),round(x.h,2),round((x.l+x.h)/2,2)]));
  rows.push([],["","Sub-total","","",round(c.subL,2),round(c.subH,2),round((c.subL+c.subH)/2,2)]);
  rows.push(["","Contingency "+S.contingency+"%","","",round(c.contL,2),round(c.contH,2),round((c.contL+c.contH)/2,2)]);
  rows.push(["","Total excl. GST","","",round(c.totL,2),round(c.totH,2),round((c.totL+c.totH)/2,2)]);
  if(S.gst){
    rows.push(["","GST "+S.gstRate+"%","","",round(c.gstL,2),round(c.gstH,2),round((c.gstL+c.gstH)/2,2)]);
    rows.push(["","Grand total","","",round(c.grandL,2),round(c.grandH,2),round((c.grandL+c.grandH)/2,2)]);
  }
  rows.push([],["Annual energy cost — heat pump (Rs)",round(c.sc.hp.yr)]);
  rows.push(["Annual energy cost — electric (Rs)",round(c.sc.el.yr)]);
  rows.push(["Annual energy cost — gas (Rs)",round(c.sc.gas.yr)]);
  rows.push(["Annual saving vs electric (Rs)",round(c.saveEl)]);

  download(new Blob(["\ufeff"+rows.map(r=>r.map(q).join(",")).join("\r\n")],{type:"text/csv;charset=utf-8"}), fileStem("boq")+"-BOQ.csv");

function fileStem(view){
  const v=view||S.view;
  const base=(S.org||"laundry-proposal").replace(/[^\w\u0900-\u097F -]/g,"").trim().replace(/\s+/g,"-");
  return base+"-"+v+"-"+S.date;
}
function download(blob,name){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},400);
}
function saveProject(){
  download(new Blob([JSON.stringify(S,null,2)],{type:"application/json"}), fileStem()+".json");
}
function loadProject(e){
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      Object.keys(d).forEach(k=>{ if(k in S) S[k]= (k==="rc") ? Object.assign({},S.rc,d.rc) : d[k]; });
      buildConsole(); syncTabs(); render();
    }catch(err){ alert(L("फाइल वाचता आली नाही. वैध प्रोजेक्ट JSON फाइल निवडा.","Could not read that file. Choose a valid project JSON file.")); }
  };
  r.readAsText(f);
  e.target.value="";
}

/* ---------- tabs ---------- */
function syncTabs(){
  document.querySelectorAll("#langTabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.lang===S.lang));
  document.querySelectorAll("#viewTabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.view===S.view));
  document.documentElement.lang=S.lang;
}
document.querySelectorAll("#langTabs button").forEach(b=>b.addEventListener("click",()=>{
  S.lang=b.dataset.lang; syncTabs(); buildConsole(); render();
}));
document.querySelectorAll("#viewTabs button").forEach(b=>b.addEventListener("click",()=>{
  S.view=b.dataset.view; syncTabs(); render();
}));
$("mtCfg").addEventListener("click",()=>{document.body.className="view-cfg";$("mtCfg").setAttribute("aria-pressed","true");$("mtDoc").setAttribute("aria-pressed","false");});
$("mtDoc").addEventListener("click",()=>{document.body.className="view-doc";$("mtDoc").setAttribute("aria-pressed","true");$("mtCfg").setAttribute("aria-pressed","false");});

/* ---------- init ---------- */
buildConsole();
syncTabs();
render();
